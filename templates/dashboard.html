<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monitoring Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      :root {
        --brand: #0d6efd;
        --bg-soft: #f3f7ff;
        --text-soft: #5f6f85;
      }

      body {
        background:
          radial-gradient(circle at 10% 10%, #e8f0ff 0%, transparent 45%),
          linear-gradient(180deg, #f8fbff 0%, #eef4ff 100%);
        min-height: 100vh;
      }

      .hero {
        background: linear-gradient(120deg, #0d6efd 0%, #0dcaf0 100%);
        color: #fff;
        border-radius: 1rem;
        box-shadow: 0 0.75rem 1.5rem rgba(13, 110, 253, 0.18);
      }

      .metric-card {
        border: 0;
        border-radius: 0.9rem;
        box-shadow: 0 0.35rem 1rem rgba(20, 34, 66, 0.09);
      }

      .metric-label {
        color: var(--text-soft);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .metric-value {
        font-size: 1.8rem;
        font-weight: 700;
      }

      .section-card {
        border: 0;
        border-radius: 0.9rem;
        box-shadow: 0 0.35rem 1rem rgba(20, 34, 66, 0.09);
      }

      .table thead th {
        font-size: 0.8rem;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: var(--text-soft);
        border-bottom-width: 1px;
      }

      .status-ok {
        color: #198754;
      }

      .status-degraded {
        color: #fd7e14;
      }

      .status-critical {
        color: #dc3545;
      }

      .muted {
        color: var(--text-soft);
      }

      .badge-status {
        min-width: 88px;
      }

      @media (max-width: 700px) {
        th:nth-child(4),
        td:nth-child(4),
        th:nth-child(5),
        td:nth-child(5) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="container py-4 py-lg-5">
      <section class="hero p-4 p-lg-5 mb-4">
        <div
          class="d-flex flex-wrap justify-content-between align-items-start gap-3"
        >
          <div>
            <h1 class="h3 h2-lg mb-2">Reseau Monitoring Dashboard</h1>
            <p class="mb-0 opacity-75">
              Extension web optionnelle, protocole TP inchange.
            </p>
          </div>
          <div class="text-white-50">
            Derniere MAJ:
            <span class="text-white fw-semibold" id="lastUpdate">-</span>
          </div>
        </div>
      </section>

      <section class="row g-3 mb-3">
        <div class="col-12 col-sm-6 col-lg">
          <div class="card metric-card h-100">
            <div class="card-body">
              <div class="metric-label">Agents actifs</div>
              <div class="metric-value" id="activeAgents">0</div>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg">
          <div class="card metric-card h-100">
            <div class="card-body">
              <div class="metric-label">CPU moyenne (%)</div>
              <div class="metric-value" id="avgCpu">0.00</div>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg">
          <div class="card metric-card h-100">
            <div class="card-body">
              <div class="metric-label">RAM moyenne (MB)</div>
              <div class="metric-value" id="avgRam">0.00</div>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg">
          <div class="card metric-card h-100">
            <div class="card-body">
              <div class="metric-label">Total REPORT</div>
              <div class="metric-value" id="totalReports">0</div>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg">
          <div class="card metric-card h-100">
            <div class="card-body">
              <div class="metric-label">Errors recents</div>
              <div class="metric-value" id="recentErrors">0</div>
            </div>
          </div>
        </div>
      </section>

      <section class="card section-card mb-3">
        <div class="card-body">
          <h2 class="h5 mb-3">Agents</h2>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th>Agent</th>
                  <th>Host</th>
                  <th>Protocole</th>
                  <th>CPU %</th>
                  <th>RAM MB</th>
                  <th>Health</th>
                  <th>Health Errors</th>
                </tr>
              </thead>
              <tbody id="agentsBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="card section-card">
        <div class="card-body">
          <h2 class="h5 mb-3">Alertes recentes</h2>
          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th>Timestamp</th>
                  <th>Type</th>
                  <th>Agent</th>
                  <th>Message</th>
                </tr>
              </thead>
              <tbody id="alertsBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>

    <script>
      function statusClass(status) {
        const normalized = (status || "").toUpperCase();
        if (normalized === "CRITICAL") return "bg-danger-subtle text-danger";
        if (normalized === "DEGRADED")
          return "bg-warning-subtle text-warning-emphasis";
        return "bg-success-subtle text-success";
      }

      function renderOverview(data) {
        const summary = data.summary || {};
        document.getElementById("activeAgents").textContent =
          summary.active_agents ?? 0;
        document.getElementById("avgCpu").textContent = Number(
          summary.avg_cpu_pct ?? 0,
        ).toFixed(2);
        document.getElementById("avgRam").textContent = Number(
          summary.avg_ram_mb ?? 0,
        ).toFixed(2);
        document.getElementById("totalReports").textContent =
          summary.total_reports ?? 0;
        document.getElementById("recentErrors").textContent =
          summary.recent_error_count ?? 0;
        document.getElementById("lastUpdate").textContent =
          data.timestamp || "-";

        const agentsBody = document.getElementById("agentsBody");
        const agents = data.agents || [];
        if (agents.length === 0) {
          agentsBody.innerHTML =
            '<tr><td colspan="7" class="muted">Aucun agent actif.</td></tr>';
        } else {
          agentsBody.innerHTML = agents
            .map((agent) => {
              const health = agent.health || {};
              const status = health.status || "OK";
              return `
            <tr>
              <td>${agent.agent_id || "-"}</td>
              <td>${agent.hostname || "-"}</td>
              <td>${agent.protocol || "-"}</td>
              <td>${Number(agent.cpu_pct || 0).toFixed(1)}</td>
              <td>${Number(agent.ram_mb || 0).toFixed(0)}</td>
              <td><span class="badge badge-status rounded-pill ${statusClass(status)}">${status}</span></td>
              <td>${health.error_count ?? 0}</td>
            </tr>
          `;
            })
            .join("");
        }

        const alertsBody = document.getElementById("alertsBody");
        const alerts = data.alerts || [];
        if (alerts.length === 0) {
          alertsBody.innerHTML =
            '<tr><td colspan="4" class="muted">Aucune alerte recente.</td></tr>';
        } else {
          alertsBody.innerHTML = alerts
            .slice()
            .reverse()
            .map(
              (alert) => `
          <tr>
            <td>${alert.timestamp || "-"}</td>
            <td>${alert.type || "-"}</td>
            <td>${alert.agent_id || "-"}</td>
            <td>${alert.message || "-"}</td>
          </tr>
        `,
            )
            .join("");
        }
      }

      async function refresh() {
        try {
          const response = await fetch("/api/overview?alert_limit=25", {
            cache: "no-store",
          });
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          const data = await response.json();
          renderOverview(data);
        } catch (error) {
          console.error(error);
        }
      }

      refresh();
      setInterval(refresh, 3000);
    </script>
  </body>
</html>
